name: Build RPM and Update OTA Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c

      - name: Build RPM via Sailfish Platform SDK
        run: |
          docker run --rm \
            --privileged \
            -v "$(pwd):/workspace" \
            -w /workspace \
            coderus/sailfishos-platform-sdk:latest \
            bash -c "mb2 -t SailfishOS-latest-armv7hl build"

      - name: Collect RPMs and build OTA repo
        run: |
          mkdir -p public
          find . -name "*.rpm" \
            -not -path "./public/*" \
            -exec cp -f {} public/ \;
          if ! ls public/*.rpm 1>/dev/null 2>&1; then
            echo "::error::No RPM files found after build"
            exit 1
          fi
          createrepo_c public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
