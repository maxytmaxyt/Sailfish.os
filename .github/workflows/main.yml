name: Build RPM and Update OTA Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & full Qt/X11 stack
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            createrepo-c \
            wget \
            xvfb \
            libgl1-mesa-dev \
            libegl1-mesa \
            libegl1 \
            libgl1 \
            libgles2 \
            libglu1-mesa \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-randr0 \
            libxcb-composite0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Download and install Sailfish SDK
        run: |
          wget https://releases.sailfishos.org/sdk/installers/3.13.5/SailfishSDK-3.13.5-linux64-online.run -O installer.run
          chmod +x installer.run
          xvfb-run ./installer.run --verbose --script-debug --accept-licenses --default-answer --confirm-command

      - name: Build RPM Package
        run: |
          export PATH="$HOME/SailfishOS/bin:$PATH"
          if command -v mb2 &> /dev/null; then
            mb2 build
          else
            docker run --rm -v $(pwd):/workspace -w /workspace coderus/sailfishos-sdk:latest /bin/bash -c "mb2 build"
          fi

      - name: Prepare Repo Directory
        run: |
          mkdir -p public
          cp -f RPMS/*.rpm public/ 2>/dev/null || cp -f *.rpm public/ 2>/dev/null || true
          createrepo_c public/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
