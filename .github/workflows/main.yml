name: Build RPM and Update OTA Repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: ota-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SFOS_RELEASE: 5.0.0.43
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Syntax Check QML Files
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace coderus/sailfishos-platform-sdk:${{ env.SFOS_RELEASE }} /bin/bash -c "
            echo 'Suche nach QML-Prüfwerkzeugen...'

            QML_LINTER=\"\"
            for path in /usr/lib64/qt5/bin/qmllint /usr/lib/qt5/bin/qmllint /usr/bin/qmllint; do
              if [ -x \"\$path\" ]; then
                QML_LINTER=\"\$path\"
                break
              fi
            done

            if [ -z \"\$QML_LINTER\" ]; then
              QML_LINTER=\$(which qmllint 2>/dev/null || true)
            fi

            if [ -z \"\$QML_LINTER\" ]; then
              echo '::warning::qmllint wurde im SDK-Container nicht gefunden, QML-Prüfung wird übersprungen.'
              exit 0
            fi

            echo \"Nutze Linter: \$QML_LINTER\"
            echo 'Starte QML Syntax-Prüfung...'

            errors=0

            while IFS= read -r file; do
              echo \"Prüfe: \$file\"
              if ! \"\$QML_LINTER\" \"\$file\"; then
                echo \"::error file=\$file::Syntaxfehler in \$file\"
                errors=\$((errors + 1))
              fi
            done < <(find . -name '*.qml' -not -path '*/.*')

            if [ \$errors -gt 0 ]; then
              echo ''
              echo \"::error::Build abgebrochen wegen \$errors QML-Syntaxfehler(n).\"
              exit 1
            fi
            echo 'Alle QML-Dateien sind syntaktisch korrekt!'
          "
      - name: Prepare RPMS directory
        run: mkdir -p RPMS
      - name: Build armv7hl
        uses: coderus/github-sfos-build@sfos5
        with:
          release: ${{ env.SFOS_RELEASE }}
          arch: armv7hl
      - name: Install createrepo-c
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c
      - name: Build OTA repo
        run: |
          mkdir -p public
          if ! ls RPMS/*.rpm 1>/dev/null 2>&1; then
            echo "::error::Es wurden keine RPM-Dateien in RPMS/ gefunden!"
            exit 1
          fi
          cp -f RPMS/*.rpm public/
          createrepo_c public/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
