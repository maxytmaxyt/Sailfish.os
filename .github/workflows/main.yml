name: Build RPM and Update OTA Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ota-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SFOS_RELEASE: 5.0.0.43   # anpassen: https://docker.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax Check QML Files
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace coderus/sailfishos-platform-sdk:${{ env.SFOS_RELEASE }} /bin/bash -c "
            if lsof -t /dev/null >/dev/null 2>&1; then :; fi
            echo 'Starte QML Syntax-Prüfung...'
            errors=0
            failed_files=\"\"
            while IFS= read -r file; do
              echo \"Prüfe: \$file\"
              if ! qmllint \"\$file\"; then
                echo \"::error file=\$file::Syntaxfehler in \$file\"
                failed_files=\"\$failed_files\n - \$file\"
                errors=\$((errors + 1))
              fi
            done < <(find . -name '*.qml')
            if [ \$errors -gt 0 ]; then
              echo -e \"\n::: FEHLERZUSAMMENFASSUNG :::\"
              echo -e \"Folgende \$errors Datei(en) enthalten Syntaxfehler:\$failed_files\n\"
              echo \"::error::Build abgebrochen wegen QML-Syntaxfehlern.\"
              exit 1
            fi
            echo 'Alle QML-Dateien sind syntaktisch korrekt!'
          "

      - name: Prepare RPMS directory
        run: mkdir -p RPMS

      - name: Build armv7hl
        uses: coderus/github-sfos-build@sfos5   # sfos5 für >= 5.0.0; master für 4.1–4.x
        with:
          release: ${{ env.SFOS_RELEASE }}
          arch: armv7hl

      - name: Install createrepo-c
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c

      - name: Build OTA repo
        run: |
          mkdir -p public
          cp -f RPMS/*.rpm public/
          if ! ls public/*.rpm 1>/dev/null 2>&1; then
            echo "::error::No RPM files found in RPMS/"
            exit 1
          fi
          createrepo_c public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
